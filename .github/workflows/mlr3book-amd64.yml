name: Docker Image CI mlr3book amd64

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mlr3book-amd64
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: mlr3book
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: mlrorg/mlr3-book:latest
          build-args: |
            GH_PAT=${{ secrets.GH_PAT }}

  # Publishes the R library of the pushed image to GitHub Pages.
  pages:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull image
        run: docker pull mlrorg/mlr3-book:latest
      - name: Extract installed packages
        run: |
          mkdir -p site
          cp pages/index.html site/
          docker run --rm -i \
            -e IMAGE=mlrorg/mlr3-book:latest \
            -e GITHUB_SHA="${GITHUB_SHA}" \
            mlrorg/mlr3-book:latest Rscript - < pages/extract-packages.R > site/mlr3book.json
          test -s site/mlr3book.json
      # a re-run keeps the artifact of the earlier attempt, and
      # actions/deploy-pages refuses to deploy when it finds more than one
      - name: Remove stale Pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
            xargs -r -I {} gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/{}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

name: GitHub Pages

# Publishes the R library of the pushed images to GitHub Pages.
on:
  workflow_run:
    workflows:
      - Docker Image CI mlr3book amd64
      - Docker Image CI (mlr3slim multi-arch)
      - Docker Image CI (mlr3full multi-arch)
      - Docker Image CI mlr3website amd64
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # one runner per image so that only a single image is pulled per runner
  extract:
    # a pull request build does not push a new image, so there is nothing to update
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [mlr3-book, mlr3-slim, mlr3-full, mlr3-website]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Extract installed packages
        run: |
          docker pull "mlrorg/${{ matrix.image }}:latest"
          docker run --rm -i \
            -e IMAGE="mlrorg/${{ matrix.image }}:latest" \
            -e GITHUB_SHA="${GITHUB_SHA}" \
            "mlrorg/${{ matrix.image }}:latest" Rscript - \
            < pages/extract-packages.R > "${{ matrix.image }}.json"
          test -s "${{ matrix.image }}.json"
      - name: Upload package list
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.image }}
          path: ${{ matrix.image }}.json

  deploy:
    needs: extract
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download package lists
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
      - name: Assemble site
        run: |
          mkdir -p site
          cp pages/index.html site/
          jq -s '{generated: (now | todateiso8601), images: .}' \
            mlr3-book.json mlr3-slim.json mlr3-full.json mlr3-website.json > site/packages.json
      # a re-run keeps the artifact of the earlier attempt, and
      # actions/deploy-pages refuses to deploy when it finds more than one
      - name: Remove stale Pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
            xargs -r -I {} gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/{}"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
